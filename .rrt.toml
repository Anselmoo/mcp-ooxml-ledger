# Config for repo-release-tools (rrt: https://github.com/Anselmoo/repo-release-tools), used
# via its rrt-branch-name / rrt-commit-subject pre-commit hooks (.pre-commit-config.yaml).
# Schema-verified against rrt's own rrt-config.schema.json (`additionalProperties: false` --
# every key below is real, not guessed); the version-tracking block below was generated by
# `rrt init` (dry-run, target=rrt-toml) against this repo's actual pyproject.toml + src layout.
[tool.rrt]
release_branch = "release/v{version}"
changelog_file = "CHANGELOG.md"
lock_command = ["uv", "lock", "-U"]
generated_files = ["uv.lock"]
version_source = "pyproject.toml"

# Built-in commit/branch types (feat, fix, chore, docs, refactor, test, ci, perf, style,
# build, deps) cover every branch and commit subject in this repo's history except
# `spec: ...` commits (spec-document changes under docs/superpowers/specs/), which isn't
# conventional-commits standard, so it's opted in here rather than left to fail the hook.
#
# MEASURED 2026-08-27, and it does NOT work: the pinned `rrt-commit-subject` hook
# (repo-release-tools v1.15.0) rejects `spec: ...` with "Allowed types: feat, fix, chore,
# docs, refactor, test, ci, perf, style, build, deps" -- the built-in list, this key absent
# from it. `spec` IS schema-valid for `extra_commit_types` (`additionalProperties: false`
# checked) -- but schema-valid is not the same as honoured by the hook, and conflating the
# two is exactly the kind of claim this project exists to catch. Left in place as correct
# config a later rrt version may read; until then, use `docs(spec): ...`, which
# extra_section_map below already routes to the same changelog section.
extra_commit_types = ["spec"]

# Route `spec:` commits to the same changelog section as `docs:` (rrt's built-in
# SECTION_MAP maps docs -> "Documentation") — a spec change is a documentation change, not
# a code change.
[tool.rrt.extra_section_map]
spec = "Documentation"

[[tool.rrt.version_targets]]
path = "pyproject.toml"
kind = "pep621"
ci_format = "pep440"

[[tool.rrt.version_targets]]
path = "src/ooxml_ledger/__init__.py"
kind = "python_version"
ci_format = "pep440"

# `mcpb/build.sh` names its output `dist/ooxml-ledger-${VERSION}.mcpb` by reading this
# file's version, so a manifest left behind at 0.1.0.dev0 produces a bundle whose filename
# contradicts the tag it was built from.
#
# kind = "pattern" requires EXACTLY ONE capture group (the version); the `^  ` anchor under
# re.MULTILINE keeps this off the sibling `"manifest_version": "0.4"` key (`\s*` can't
# consume `"manifest_` before the literal `"version"`). A version target, not a pin target,
# because `rrt release check` FAILS on version-target drift and only WARNS on pin drift, and
# this file has exactly one version string, so the stronger contract is available.
[[tool.rrt.version_targets]]
path = "mcpb/manifest.json"
kind = "pattern"
pattern = '^  "version": "([^"]+)",$'
ci_format = "pep440"

# server.json declares the version TWICE -- top level, and inside packages[0], which is the
# one the MCP registry actually reads. It cannot be two version_targets: MEASURED 2026-08-30
# against rrt 1.15.0, `replace_all_versions_atomic` computes every target's replacement from
# the file's ORIGINAL text (phase 1) and writes them in order (phase 2), so two targets on
# one path silently lose the first write.
#
# A pin target is the mechanism that works: `replace_pin_in_file` substitutes with count=0
# (every occurrence) and requires EXACTLY THREE groups -- prefix, version, suffix. The hard
# gate is tests/test_packaging.py::test_every_declared_version_agrees, since `rrt release
# check` only warns on pin drift.
[[tool.rrt.pin_targets]]
path = "server.json"
pattern = '("version": ")([^"]+)(")'

# The version now appears a THIRD time in server.json: the OCI package's `identifier`
# carries it as a `:0.1.0` suffix (`ghcr.io/anselmoo/mcp-ooxml-ledger:0.1.0`), which the
# pin target above cannot reach -- it matches the literal key `"version"`, and the OCI
# identifier has no such key; the version lives inside a different key's string value.
# A second, separate pin target on the same path is safe here (unlike two
# version_targets on one path -- see the comment above): each pin target's regex
# substitutes independently against server.json's on-disk text via
# `replace_pin_in_file`'s own count=0 pass, so this does not hit the phase-1/phase-2
# ordering bug that ruled out a second version_target.
#
# Anchored on the literal `ghcr.io/anselmoo/mcp-ooxml-ledger:` prefix (not a generic
# `identifier` match) so it cannot also fire on the pypi package's plain
# `"identifier": "mcp-ooxml-ledger"` (no colon-version suffix to capture) or drift onto
# some future unrelated OCI reference. Lowercase `anselmoo` deliberately, matching the
# ghcr.io push (OCI refs must be lowercase) -- NOT `server.json`'s top-level `name`
# field, which stays `Anselmoo` and is covered by the pin target above instead.
[[tool.rrt.pin_targets]]
path = "server.json"
pattern = '("identifier": "ghcr\.io/anselmoo/mcp-ooxml-ledger:)([^"]+)(")'
